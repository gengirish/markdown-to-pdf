[pytest]
# Run from apps/api: `python -m pytest`.
#
# pythonpath puts apps/api on sys.path so `import api...` resolves without an
# editable install, and testpaths keeps a bare `pytest` from walking into
# test_api.py / sdk/test_sdk.py, which are live-server scripts rather than
# pytest modules.
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
