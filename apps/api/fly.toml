app = "certforge-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Apply the Procrastinate schema from a release_command, not on every boot.
  PROCRASTINATE_APPLY_SCHEMA = "0"

  # IS_PROD keys off VERCEL_ENV or ENV. Nothing sets VERCEL_ENV off Vercel, so
  # after the cutover the API considered itself non-production and would fall
  # back to dev defaults (ADMIN_KEY="admin-dev-key", a dev CERT_SECRET) instead
  # of refusing to boot when a secret is missing.
  ENV = "production"

  # Vercel rewrites /api, /certificate and /invoice here as a proxy, so
  # request.base_url reads certforge-api.fly.dev rather than the public domain.
  # Without this, generated links and QR targets pointed at the Fly host over
  # plain http. Keep in sync with the domain Vercel serves.
  SITE_URL = "https://certs.intelliforge.tech"

[deploy]
  # Migrations and the queue schema run once per deploy, not on every cold start.
  release_command = "python -m api.release"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]

  # Scale to zero: no traffic -> machine stops -> the worker's Postgres
  # LISTEN connection closes -> Neon compute autosuspends.
  # "stop" (not "suspend") is deliberate: a suspended machine keeps a frozen
  # TCP socket to Neon that is dead on resume, and Procrastinate would keep
  # using it. A full stop forces a clean reconnect.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  # No periodic health check on purpose.
  #
  # Fly clamps check intervals to a 1 minute maximum ("Service HTTP check has an
  # interval greater than 1 minute; this will be lowered to 1 minute"), and a
  # recurring 60s touch is far shorter than the idle window this service is
  # supposed to sleep through. With auto_start_machines the machine is started
  # by real requests, so a liveness probe buys nothing here and only risks
  # holding the machine — and its Postgres connection — awake.
  #
  # /api/health is still there for deploy gates and manual checks. It reads env
  # flags only and never queries Postgres, so it stays safe to curl by hand.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
