name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # apps/api/requirements.txt after the Phase 2 monorepo restructure.
  API_REQUIREMENTS: apps/api/requirements.txt

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: pip install ruff
      - run: ruff check apps/api/api/ sdk/pdfcert/

      # ESLint had never run in CI, despite this job previously being called
      # "lint-and-type-check". Goes through turbo so both frontends are linted.
      - run: npm ci
      - run: npm run lint

      # Guards against .gitignore swallowing source. The stock Python block's
      # unanchored `lib/` rule hid apps/web/lib/ — the API client — from
      # `git add`, and nothing in CI would have noticed the files go missing.
      - run: python scripts/check_tracked_sources.py

  # Unit tests (pytest, SQLite-backed, no live server). These were previously
  # not run anywhere, so the suite had gone red unnoticed.
  test-unit:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS pytest pytest-asyncio
      - working-directory: apps/api
        run: python -m pytest

  test-api:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      CERT_API_KEYS: test-api-key
      ADMIN_KEY: test-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS requests
      - name: Start API
        working-directory: apps/api
        run: python -m uvicorn api.index:app --host 127.0.0.1 --port 8000 &
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy in 60s" >&2
          exit 1
      - working-directory: apps/api
        run: python test_api.py

  test-sdk:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS requests
      - run: pip install -e ./sdk
      - name: Start API
        working-directory: apps/api
        run: python -m uvicorn api.index:app --host 127.0.0.1 --port 8000 &
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy in 60s" >&2
          exit 1
      - run: python sdk/test_sdk.py

  # Builds BOTH frontends, through turbo.
  #
  # This job used to run only `npm run build:web`, which resolves to
  # `--workspace=pdf-cert-generator` — so apps/web was never built in CI, and
  # the root turbo scripts were never exercised at all. That single blind spot
  # hid two separate breakages: apps/web failed to build (Clerk's keyless path
  # prerenders /_global-error), and every root script died on a missing
  # `packageManager` field. Both were found by hand, not by CI.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci

      # Exercises turbo's workspace resolution and builds apps/web + apps/legacy-web.
      - run: npm run build

      # Vercel does NOT go through turbo — it calls this command directly
      # (vercel.json buildCommand). Assert the production path separately so a
      # turbo-only regression cannot pass while the deploy breaks, or vice versa.
      - run: npm run build:web

  test-e2e:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r $API_REQUIREMENTS
      - run: npx playwright install --with-deps chromium
      # playwright.config.js starts uvicorn in apps/api and vite in apps/legacy-web.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
