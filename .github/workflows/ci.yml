name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # apps/api/requirements.txt after the Phase 2 monorepo restructure.
  API_REQUIREMENTS: apps/api/requirements.txt

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check apps/api/api/ sdk/pdfcert/

  # Unit tests (pytest, SQLite-backed, no live server). These were previously
  # not run anywhere, so the suite had gone red unnoticed.
  test-unit:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS pytest pytest-asyncio
      - working-directory: apps/api
        run: python -m pytest

  test-api:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      CERT_API_KEYS: test-api-key
      ADMIN_KEY: test-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS requests
      - name: Start API
        working-directory: apps/api
        run: python -m uvicorn api.index:app --host 127.0.0.1 --port 8000 &
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy in 60s" >&2
          exit 1
      - working-directory: apps/api
        run: python test_api.py

  test-sdk:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r $API_REQUIREMENTS requests
      - run: pip install -e ./sdk
      - name: Start API
        working-directory: apps/api
        run: python -m uvicorn api.index:app --host 127.0.0.1 --port 8000 &
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy in 60s" >&2
          exit 1
      - run: python sdk/test_sdk.py

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      # Same command Vercel runs (see vercel.json buildCommand).
      - run: npm run build:web

  test-e2e:
    runs-on: ubuntu-latest
    env:
      CERT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r $API_REQUIREMENTS
      - run: npx playwright install --with-deps chromium
      # playwright.config.js starts uvicorn in apps/api and vite in apps/legacy-web.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
