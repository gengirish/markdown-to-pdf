# Ruff config for CI (.github/workflows/ci.yml runs `ruff check apps/api/api/ sdk/pdfcert/`).
#
# Context: CI had been linting the root `api/` directory, which the Phase 2
# restructure emptied — so the lint job had been passing on nothing and this
# code has effectively never been linted. Pointing ruff at apps/api/api/
# surfaces ~55 pre-existing unused imports unrelated to any current change.
#
# Rather than mass-edit files nobody touched, the gate starts at the pyflakes
# "real error" set (syntax errors, undefined names, broken comparisons) and can
# be widened deliberately once the unused-import backlog is cleared.

line-length = 120

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# SQLAlchemy declarative models refer to each other through string forward
# references in Mapped[...] annotations ("Organization", "Template", ...).
# Those resolve through the mapper registry at runtime; ruff cannot see it.
"apps/api/api/models/*.py" = ["F821"]
"apps/api/api/routes/verify.py" = ["F821"]
